name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APKs
        run: ./gradlew --stacktrace testDebugUnitTest assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/vctrnr.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/vctrnr-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vctrnr-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Lint
        run: ./gradlew --stacktrace lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
          if-no-files-found: ignore
